name = "monolith-blog"
main = "src/index.ts"
account_id = "38a3abc42da744bac9e51c6fa6035fb4"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[vars]
BLOG_NAME = "Monolith"
# 改成你真实的Pages地址
SITE_ORIGIN = "https://monolith-blog-bpw.pages.dev"
AUTO_SCHEMA_MIGRATION = "true"
CLOUDFLARE_ACCOUNT_ID = "38a3abc42da744bac9e51c6fa6035fb4"
# 前端跨域放行，和上面地址保持一致
CORS_ALLOW_ORIGIN = "https://monolith-blog-bpw.pages.dev"
# 后台登录密码，这里改成你自己想要的密码！
ADMIN_PASSWORD = "Zjw520125vv"

# D1数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "monolith_blog_db"
database_id = "3ce5768d-56ac-4989-83b6-4b5b3e1388e4"
migrations_dir = "src/migrations"

# R2存储桶绑定 
[[r2_buckets]]
binding = "R2"
bucket_name = "monolith-blog-img"

